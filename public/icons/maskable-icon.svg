<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">B SPACE maskable app icon</title>
  <desc id="desc">Maskable B SPACE icon with a centered white B monogram and teal parking-space accent on dark navy.</desc>
  <defs>
    <linearGradient id="bg" x1="64" y1="64" x2="448" y2="448" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0A1322"/>
      <stop offset="1" stop-color="#172943"/>
    </linearGradient>
    <linearGradient id="accent" x1="350" y1="118" x2="428" y2="196" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#85E7D8"/>
      <stop offset="1" stop-color="#18B9A4"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>
  <circle cx="386" cy="138" r="54" fill="url(#accent)"/>
  <circle cx="386" cy="138" r="80" fill="#85E7D8" opacity="0.10"/>

