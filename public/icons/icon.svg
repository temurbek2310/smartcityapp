<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">SmartCity app icon</title>
  <desc id="desc">Modern SmartCity app icon featuring a luminous geometric S monogram with smart city architectural accents on dark obsidian navy.</desc>
  <defs>
    <linearGradient id="scBg" x1="48" y1="36" x2="464" y2="476" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#080E1C"/>
      <stop offset="45%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#15223A"/>
    </linearGradient>

    <linearGradient id="scIndigo" x1="120" y1="120" x2="380" y2="390" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#9065FA"/>
      <stop offset="45%" stop-color="#6C47E0"/>
      <stop offset="100%" stop-color="#472BB3"/>
    </linearGradient>

    <linearGradient id="scTeal" x1="140" y1="120" x2="370" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <linearGradient id="scBeam" x1="330" y1="100" x2="400" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7DF8E8"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <filter id="scShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#030712" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- App icon container with smooth rounded corners -->
  <rect x="20" y="20" width="472" height="472" rx="112" fill="url(#scBg)"/>
  <rect x="20" y="20" width="472" height="472" rx="112" fill="none" stroke="#334155" stroke-width="2.5" opacity="0.35"/>

  <!-- Ambient pulse behind emblem -->
  <circle cx="366" cy="146" r="62" fill="url(#scBeam)" opacity="0.12"/>
  <circle cx="256" cy="256" r="140" fill="#6C47E0" opacity="0.10"/>

  <g filter="url(#scShadow)">
    <!-- Architectural Smart Skyline Backdrop (Integrated inside the emblem) -->
    <rect x="208" y="208" width="24" height="106" rx="6" fill="url(#scTeal)" opacity="0.28"/>
    <rect x="244" y="166" width="24" height="148" rx="6" fill="url(#scTeal)" opacity="0.45"/>
    <rect x="280" y="196" width="24" height="118" rx="6" fill="url(#scTeal)" opacity="0.32"/>

    <!-- Primary 'S' Monogram - Upper Curve -->
    <path d="M352 168 C338 140, 302 124, 252 124 C184 124, 146 162, 146 208 C146 250, 180 274, 238 290 L274 300 C322 314, 348 334, 348 372 C348 418, 308 444, 248 444 C192 444, 154 416, 142 388" 
          fill="none" 
          stroke="url(#scIndigo)" 
          stroke-width="48" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- High-Tech Neon Flow Core -->
    <path d="M346 172 C330 144, 298 132, 252 132 C190 132, 156 166, 156 208 C156 244, 186 266, 242 282 L278 292 C328 308, 356 332, 356 372 C356 422, 314 444, 248 444 C196 444, 160 418, 148 392" 
          fill="none" 
          stroke="url(#scTeal)" 
          stroke-width="16" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Central Transit Waypoints (Flow dots) -->
    <circle cx="252" cy="132" r="7" fill="#FFFFFF"/>
    <circle cx="260" cy="287" r="7" fill="#FFFFFF"/>
    <circle cx="248" cy="444" r="7" fill="#FFFFFF"/>

    <!-- Smart Beacon / Location Node (Top-right pulse) -->
    <circle cx="366" cy="146" r="30" fill="url(#scTeal)"/>
    <circle cx="366" cy="146" r="14" fill="#FFFFFF"/>
    <circle cx="366" cy="146" r="46" fill="none" stroke="#38BDF8" stroke-width="3" stroke-dasharray="7 5" opacity="0.75"/>
  </g>
</svg>
